name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Android Debug APK
        run: |
          BUILD_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            BUILD_CMD="gradle"
          fi
          $BUILD_CMD assembleDebug -Djava.awt.headless=true --stacktrace

      - name: Rename and Organize APK
        run: |
          mkdir -p build-apks
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-apks/LaborKhata-Native-Debug.apk
            echo "APK generated successfully: build-apks/LaborKhata-Native-Debug.apk"
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaborKhata-Android-APK
          path: build-apks/LaborKhata-Native-Debug.apk
          retention-days: 30
